name: CI

# Guards the default branch: every push and pull request must build and pass
# backend and frontend tests before merge.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore .NET dependencies
        run: dotnet restore hero-story.sln

      - name: Build solution
        run: dotnet build hero-story.sln --no-restore --configuration Release

      - name: Run .NET tests
        run: dotnet test hero-story.sln --no-build --configuration Release --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  frontend:
    name: Frontend type-check, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/HeroStory.Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix src/HeroStory.Frontend ci

      - name: Type-check
        run: npm --prefix src/HeroStory.Frontend run lint

      - name: Run frontend tests
        run: npm --prefix src/HeroStory.Frontend run test

      - name: Build frontend
        run: npm --prefix src/HeroStory.Frontend run build
