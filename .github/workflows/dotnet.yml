name: dotnet

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore hero-story.sln
      - name: Build
        run: dotnet build hero-story.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test hero-story.sln --configuration Release --no-build
