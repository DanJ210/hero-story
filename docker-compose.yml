services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hero-story-sqlserver
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env before starting SQL Server}
    ports:
      - "1433:1433"
    volumes:
      - hero_story_sqlserver_data:/var/opt/mssql
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: hero-story-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - hero_story_azurite_data:/data
    restart: unless-stopped

volumes:
  hero_story_sqlserver_data:
  hero_story_azurite_data:
